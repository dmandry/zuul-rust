- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
        - event: comment-added
          comment: '^(Patch Set [0-9]+:\n\n)?(?i:recheck)$'
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base
    run: playbooks/run.yaml
    parent: null
    attempts: 1
