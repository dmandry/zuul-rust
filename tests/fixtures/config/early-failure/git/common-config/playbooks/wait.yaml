- hosts: localhost
  tasks:
    - file:
        path: "{{zuul.executor.work_root}}/wait_start_flag"
        state: touch
    # Do not finish until test creates the flag file
    - debug:
        msg: "Waiting for {{zuul.executor.work_root}}/wait_continue_flag"
    - wait_for:
        state: present
        path: "{{zuul.executor.work_root}}/wait_continue_flag"
    - file:
        path: "{{zuul.executor.work_root}}/wait_end_flag"
        state: touch
