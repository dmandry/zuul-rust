- hosts: localhost
  tasks:
    - file:
        path: "{{zuul.executor.work_root}}/output_failure_start_flag"
        state: touch
    - debug:
        msg: "Waiting for {{zuul.executor.work_root}}/output_failure_continue1_flag"
    - wait_for:
        state: present
        path: "{{zuul.executor.work_root}}/output_failure_continue1_flag"
    - shell: "echo This output indicates failure"
    - debug:
        msg: "Waiting for {{zuul.executor.work_root}}/output_failure_continue2_flag"
    - wait_for:
        state: present
        path: "{{zuul.executor.work_root}}/output_failure_continue2_flag"
# Do not fail; this test also verifies that an early failure is sticky.
