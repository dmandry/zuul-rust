- authorization-rule:
    name: auth-rule-one
    conditions:
      - sub: venkman
      - sub: zeddemore
- authorization-rule:
    name: auth-rule-two
    conditions:
      - sub: gozer
        iss: another_dimension
- role:
    name: enqueue
    permissions:
      enqueue: true

- api-root:
    role-mappings:
      auth-rule-one: admin
      auth-rule-three:
        - enqueue
