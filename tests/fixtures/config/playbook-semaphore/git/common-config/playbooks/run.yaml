- hosts: all
  tasks:
    - debug: var=waitpath
    - file:
        path: "{{zuul.executor.work_root}}/run_start_flag"
        state: touch
    # Do not finish until test creates the flag file
    - wait_for:
        state: present
        path: "{{waitpath}}"
    - file:
        path: "{{zuul.executor.work_root}}/run_end_flag"
        state: touch
