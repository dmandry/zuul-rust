      - name: test_secret
        secret: test-secret

- project:
    name: org/project
    check:
      jobs:
        - job-output

- project:
    name: org/project2
    check:
      jobs:
        - job-output-failure

- project:
    name: org/project3
    check:
      jobs:
        - job-output-missing-role
        - job-output-missing-role-include

- project:
    name: org/project4
    check:
      jobs:
        - job-output-split-streams

- project:
    name: org/project5
