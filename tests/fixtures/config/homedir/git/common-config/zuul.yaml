- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
        - event: comment-added
          comment: '^(Patch Set [0-9]+:\n\n)?(?i:recheck)$'
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base
    parent: null
    pre-run: playbooks/test.yaml
    post-run: playbooks/test.yaml
    nodeset:
      nodes:
        - name: controller
          label: label1
    attempts: 1
