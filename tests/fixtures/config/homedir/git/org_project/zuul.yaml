- job:
    name: testjob
    run: playbooks/test.yaml
    files:
      - test

- job:
    name: linkjob
    run: playbooks/symlink.yaml
    files:
      - link

- job:
    name: preserve-parent
    parent: empty-base
    pre-run: playbooks/preserve-parent-pre.yaml
    post-run: playbooks/preserve-parent-post.yaml
    preserve-home-paths:
      - good-parent-file

- job:
    name: preservejob
    parent: preserve-parent
    pre-run: playbooks/preserve-pre.yaml
    run: playbooks/preserve.yaml
    post-run: playbooks/preserve-post.yaml
    preserve-home-paths:
      - test/good-job-file
    files:
      - preserve

- project:
    check:
      jobs:
        - testjob
        - linkjob
        - preservejob
