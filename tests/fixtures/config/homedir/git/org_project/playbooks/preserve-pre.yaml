- hosts: localhost
  tasks:
    - stat:
        path: "{{ ansible_env['HOME'] }}/good-parent-file"
      register: results
    - assert:
        that:
          - results.stat.exists

    # TODO: This should be deleted in the future, but cause a warning now
    - stat:
        path: "{{ ansible_env['HOME'] }}/bad-parent-file"
      register: results
    - assert:
        that:
          - results.stat.exists

    - stat:
        path: "{{ ansible_env['HOME'] }}/test/good-job-file"
      register: results
    - assert:
        that:
          - not results.stat.exists
    - file:
        path: "{{ ansible_env['HOME'] }}/test"
        state: directory
    - file:
        path: "{{ ansible_env['HOME'] }}/test/good-job-file"
        state: touch
    - stat:
        path: "{{ ansible_env['HOME'] }}/test/good-job-file"
      register: results
    - assert:
        that:
          - results.stat.exists

    - stat:
        path: "{{ ansible_env['HOME'] }}/test/bad-job-file"
      register: results
    - assert:
        that:
          - not results.stat.exists
    - file:
        path: "{{ ansible_env['HOME'] }}/test"
        state: directory
    - file:
        path: "{{ ansible_env['HOME'] }}/test/bad-job-file"
        state: touch
    - stat:
        path: "{{ ansible_env['HOME'] }}/test/bad-job-file"
      register: results
    - assert:
        that:
          - results.stat.exists

    # Create a bunch of warnings to make sure they are suppressed
    # after a certain number
    - file:
        path: "{{ ansible_env['HOME'] }}/warn"
        state: directory
    - file:
        path: "{{ ansible_env['HOME'] }}/warn/warning1"
        state: touch
    - file:
        path: "{{ ansible_env['HOME'] }}/warn/warning2"
        state: touch
    - file:
        path: "{{ ansible_env['HOME'] }}/warn/warning3"
        state: touch
    - file:
        path: "{{ ansible_env['HOME'] }}/warn/warning4"
        state: touch
    - file:
        path: "{{ ansible_env['HOME'] }}/warn/warning5"
        state: touch
    - file:
        path: "{{ ansible_env['HOME'] }}/warn/warning6"
        state: touch
