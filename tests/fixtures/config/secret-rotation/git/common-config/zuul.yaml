- pipeline:
    name: check
    manager: independent
    post-review: true
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- pipeline:
    name: gate
    manager: dependent
    success-message: Build succeeded (gate).
    trigger:
      gerrit:
        - event: comment-added
          approval:
            - Approved: 1
    success:
      gerrit:
        Verified: 2
        submit: true
    failure:
      gerrit:
        Verified: -2
    start:
      gerrit:
        Verified: 0
    precedence: high

- job:
    name: base
    parent: null
    nodeset:
      nodes:
        - name: test_node
          label: test_label

- secret:
    name: base-oidc-secret
    oidc:
      claims:
        aud: sts.amazonaws.com
        my_claim: base_secret

- job:
    name: base-secret
    parent: base
    pre-run: playbooks/secret.yaml
    secrets:
      - name: base_oidc_secret
        secret: base-oidc-secret
