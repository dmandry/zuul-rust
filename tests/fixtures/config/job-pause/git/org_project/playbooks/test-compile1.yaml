- hosts: all
  tasks:
    # We expect the variables of compile1 to exist
    - assert:
        that:
          - compile1 is defined
          - compile1 == 'test'

    # This job has no child job so just pause to check if
    # we don't break if there are no child jobs.
    - name: Pause
      zuul_return:
        data:
          zuul:
            pause: true
