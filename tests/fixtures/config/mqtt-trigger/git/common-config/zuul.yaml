- pipeline:
    name: check
    manager: independent
    trigger:
      mqtt:
        - topic: 'tenant-one/zuul/#'
          required-payload:
            "$.action":
              regex: '^enque.*'
              negate: false
          data-mapping:
            project-canonical-name: '$.project_canonical_name'
            ref: '$.ref'
        - topic: 'tenant-one/zuul/#'
          required-payload:
            "$.action": 'enqueue'
          data-mapping:
            project-canonical-name: '$.project_canonical_name'
            ref: '$.branch'
          debug: true
        - topic: 'tenant-one/zuul/#'
          required-payload:
            "$.action": 'enqueue'
          data-mapping:
            project-hostname: '$.project_hostname'
            project: '$.project_name'
            change: '$.change'
        - topic: 'tenant-one/zuul/#'
          required-payload:
            "$.action": 'enqueue'
          data-mapping:
            project-hostname: '$.project_hostname'
            project: '$.project_name'
            change: '$.change'
            patchset: '$.patchset'
        - topic: 'tenant-one/zuul/#'
          required-payload:
            "$.event_count": 1024
          data-mapping:
            project-hostname: '$.project_hostname'
            project: '$.project_name'
            change: '$.change'
            patchset: '$.patchset'
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base
    parent: null

- job:
    name: project-test1
    nodeset:
      nodes:
        - name: controller
          label: label1
    run: playbooks/project-test1.yaml

- project:
    name: org/project
    check:
      jobs:
        - project-test1
