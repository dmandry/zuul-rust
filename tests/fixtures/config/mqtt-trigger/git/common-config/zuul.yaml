- pipeline:
    name: check
    manager: independent
    trigger:
      mqtt:
        - event: ref-updated
          topic: 'tenant-one/zuul/testevent'
          action: 'enqueue'
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base
    parent: null

- job:
    name: project-test1
    nodeset:
      nodes:
        - name: controller
          label: label1
    run: playbooks/project-test1.yaml

- project:
    name: org/project
    check:
      jobs:
        - project-test1
