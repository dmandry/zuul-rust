- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- pipeline:
    name: gate
    manager: dependent
    success-message: Build succeeded (gate).
    trigger:
      gerrit:
        - event: comment-added
          approval:
            - Approved: 1
    success:
      gerrit:
        Verified: 2
        submit: true
    failure:
      gerrit:
        Verified: -2
    start:
      gerrit:
        Verified: 0
    precedence: high

- pipeline:
    name: post
    manager: independent
    trigger:
      gerrit:
        - event: ref-updated
          ref: ^(?!refs/).*$

- pipeline:
    name: tag
    manager: independent
    trigger:
      gerrit:
        - event: ref-updated
          ref: ^refs/tags/.*$

- job:
    name: base
    parent: null
    run: playbooks/base.yaml
    nodeset:
      nodes:
        - label: heat-stack
          name: controller
          template-config:
            heat-template-path: zuul.d/templates/test-stack.yaml

- job:
    name: check-job
    run: playbooks/check.yaml

- job:
    name: post-job
    run: playbooks/post.yaml

- job:
    name: tag-job
    run: playbooks/tag.yaml

- project:
    name: org/project
    check:
      jobs:
        - check-job
    gate:
      jobs:
        - check-job
    post:
      jobs:
        - post-job
    tag:
      jobs:
        - tag-job

- image:
    name: debian
    type: cloud

- flavor:
    name: normal

- label:
    name: heat-stack
    image: debian
    flavor: normal

- section:
    name: heat-base
    abstract: true
    connection: heat
    launch-timeout: 600
    launch-attempts: 2
    label-defaults:
      host-key-checking: false
      boot-timeout: 120
    flavors:
      - name: normal
    images:
      - name: debian

- section:
    name: heat
    parent: heat-base

- provider:
    name: heat-main
    section: heat
    template-policy:
      allowed-intrinsic-functions:
        - 'get_param'
    labels:
      - name: heat-stack
