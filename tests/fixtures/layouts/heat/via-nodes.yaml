- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- nodeset:
    name: via-ns
    nodes:
      - name: bastion
        label: heat-stack
        template-config:
          heat-template-path: zuul.heat.d/test-stack.yaml
      - name: internal
        via: bastion

- job:
    name: base
    parent: null
    run: playbooks/base.yaml

- job:
    name: check-job
    run: playbooks/check.yaml
    nodeset: via-ns

- project:
    name: org/project
    check:
      jobs:
        - check-job

- image:
    name: debian
    type: cloud

- flavor:
    name: normal

- label:
    name: heat-stack
    image: debian
    flavor: normal

- section:
    name: heat-base
    abstract: true
    connection: heat
    launch-timeout: 600
    launch-attempts: 2
    label-defaults:
      host-key-checking: false
      boot-timeout: 120
    flavors:
      - name: normal
    images:
      - name: debian

- section:
    name: heat
    parent: heat-base

- provider:
    name: heat-main
    section: heat
    template-policy:
      allowed-resource-types:
        - 'OS::Nova::.*'
        - '^OS::Neutron::(?!RBAC).*'
      allowed-intrinsic-functions:
        - 'get_param'
        - 'get_resource'
        - 'get_attr'
    labels:
      - name: heat-stack
