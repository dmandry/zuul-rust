- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- nodeset:
    name: heat-nodeset
    nodes:
      - label: heat-stack
        name: controller
        template-config:
          heat-template-path: {heat_template_path}
          heat-parameters:
            flavor: m1.small

- job:
    name: base
    parent: null
    run: playbooks/base.yaml
    nodeset: heat-nodeset

- job:
    name: check-job
    run: playbooks/check.yaml

- project:
    name: org/project
    check:
      jobs:
        - check-job

- image:
    name: debian
    type: cloud

- flavor:
    name: normal

- label:
    name: heat-stack
    image: debian
    flavor: normal
