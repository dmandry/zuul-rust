- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- pipeline:
    name: gate
    manager: dependent
    success-message: Build succeeded (gate).
    trigger:
      gerrit:
        - event: comment-added
          approval:
            - Approved: 1
    success:
      gerrit:
        Verified: 2
        submit: true
    failure:
      gerrit:
        Verified: -2
    start:
      gerrit:
        Verified: 0
    precedence: high

- pipeline:
    name: post
    manager: independent
    trigger:
      gerrit:
        - event: ref-updated
          ref: ^(?!refs/).*$

- pipeline:
    name: tag
    manager: independent
    trigger:
      gerrit:
        - event: ref-updated
          ref: ^refs/tags/.*$

- job:
    name: base
    parent: null
    run: playbooks/base.yaml
    nodeset:
      nodes:
        - label: debian-normal
          name: controller

- job:
    name: check-job
    run: playbooks/check.yaml

- job:
    name: post-job
    run: playbooks/post.yaml

- job:
    name: tag-job
    run: playbooks/tag.yaml

- project:
    name: org/project
    check:
      jobs:
        - check-job
    gate:
      jobs:
        - check-job
    post:
      jobs:
        - post-job
    tag:
      jobs:
        - tag-job

- image:
    name: debian
    type: cloud

- flavor:
    name: normal

- flavor:
    name: large

- flavor:
    name: dedicated

- flavor:
    name: invalid

- label:
    name: debian-normal
    image: debian
    flavor: normal

- label:
    name: debian-large
    image: debian
    flavor: large

- label:
    name: debian-dedicated
    image: debian
    flavor: dedicated

- label:
    name: debian-invalid
    image: debian
    flavor: invalid

- section:
    name: aws-base
    abstract: true
    connection: aws
    launch-timeout: 600
    launch-attempts: 2
    object-storage:
      bucket-name: zuul
    label-defaults:
      host-key-checking: false
      boot-timeout: 120
      key-name: zuul
      tags:
        event_id: "{zuul_event_id}"
        tenant: "{tenant_name}"
    flavors:
      - name: normal
        instance-type: t3.medium
        volume-type: gp3
        volume-size: 40
        iops: 500
        throughput: 200
      - name: large
        instance-type: t3.large
      - name: dedicated
        instance-type: t3.large
        dedicated-host: True
      - name: invalid
        instance-type: invalid
    images:
      - name: debian
        image-id: ami-1e749f67

- section:
    name: aws-us-east-1
    parent: aws-base
    region: us-east-1
    label-defaults:
      tags:
        buildset: "{buildset_uuid}"

- provider:
    name: aws-us-east-1-main
    section: aws-us-east-1
    labels:
      - name: debian-normal
        volume-type: gp3
        volume-size: 40
        # Change iops and omit throughput to test label overriding the
        # flavor
        iops: 1000
      - name: debian-large
        tags:
          foo: bar
      - name: debian-dedicated
        az: us-east-1b
      - name: debian-invalid
