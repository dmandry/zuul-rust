- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- pipeline:
    name: periodic
    manager: independent
    # Trigger is required, set it to one that is a noop
    # during tests that check the timer trigger.
    trigger:
      gerrit:
        - event: ref-updated

- pipeline:
    name: periodic-stable
    manager: independent
    # Trigger is required, set it to one that is a noop
    # during tests that check the timer trigger.
    trigger:
      gerrit:
        - event: ref-updated

- job:
    name: base
    parent: null
    run: playbooks/base.yaml

- job:
    name: project-master-periodic
    run: playbooks/project-test1.yaml

- job:
    name: project-stable-periodic
    run: playbooks/project-test2.yaml

- project:
    name: org/project
    periodic:
      jobs:
        - project-master-periodic
    periodic-stable:
      jobs:
        - project-stable-periodic
