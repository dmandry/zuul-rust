- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base
    parent: null
    run: playbooks/base.yaml

- job:
    name: normal-job
    run: playbooks/check.yaml
    nodeset:
      nodes:
        - label: debian-normal
          name: controller

- job:
    name: sub1-job
    run: playbooks/check.yaml
    nodeset:
      nodes:
        - label: debian-subnode
          name: controller

- job:
    name: sub2-job
    run: playbooks/check.yaml
    nodeset:
      nodes:
        - label: debian-subnode
          name: controller

- project:
    name: org/project
    check:
      jobs:
        - normal-job
        - sub1-job
        - sub2-job

- image:
    name: debian
    type: cloud

- flavor:
    name: normal

- label:
    name: debian-normal
    image: debian
    flavor: normal

- label:
    name: debian-subnode
    image: debian
    flavor: normal

- section:
    name: aws-base
    abstract: true
    connection: aws
    launch-timeout: 600
    launch-attempts: 2
    label-defaults:
      host-key-checking: false
      boot-timeout: 120
      key-name: zuul
    flavors:
      - name: normal
        instance-type: t3.medium
    images:
      - name: debian
        image-id: ami-1e749f67

- section:
    name: aws-us-east-1
    parent: aws-base
    region: us-east-1

- provider:
    name: aws-us-east-1-main
    section: aws-us-east-1
    labels:
      - name: debian-normal
      - name: debian-subnode
        slots: 2
