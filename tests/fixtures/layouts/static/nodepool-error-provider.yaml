- image:
    name: debian
    type: cloud

- flavor:
    name: normal

- label:
    name: debian-normal
    image: debian
    flavor: normal

- label:
    name: special-hardware
    image: debian
    flavor: normal

- section:
    name: static-base
    abstract: true
    connection: static

- section:
    name: static
    parent: static-base
    flavors:
      - name: normal

- provider:
    name: static-main
    section: static
    nodes:
      - name: '198.51.100.1'
        label: does-not-exist
        aliases:
          - special-hardware
    labels:
      - name: debian-normal
      - name: special-hardware
    images:
      - name: debian
        connection-port: 22
        username: vinz
