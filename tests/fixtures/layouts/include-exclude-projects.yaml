- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- queue:
    name: shared
    allow-circular-dependencies: true
        
- job:
    name: base
    parent: null
    run: playbooks/base.yaml
    nodeset:
      nodes:
        - label: ubuntu-xenial
          name: controller
    exclude-projects:
      - org/project-unused

- job:
    name: normal-job

- job:
    name: include-job
    include-projects: org/project

- job:
    name: exclude-job
    exclude-projects:
      - org/project1

- job:
    name: both-job
    include-projects:
      - org/project
      - org/project1
      - org/project2
    exclude-projects:
      - org/project2

- job:
    name: exclude-all-job
    include-projects: []

- job:
    name: exclude-all-but-change-job
    include-projects:
      - type: change

- job:
    name: exclude-all-but-item-job
    include-projects:
      - type: item
      
- project:
    name: org/project
    queue: shared
    check:
      jobs:
        - normal-job
        - include-job
        - exclude-job
        - both-job
        - exclude-all-job
        - exclude-all-but-change-job
        - exclude-all-but-item-job
        
- project:
    name: org/project1
    queue: shared

- project:
    name: org/project2
    queue: shared

- project:
    name: org/project-unused
