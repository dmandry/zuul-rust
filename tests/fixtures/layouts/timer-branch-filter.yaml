- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- pipeline:
    name: periodic
    manager: independent
    trigger:
      timer:
        - time: '* * * * * */1'
          branch: master

- pipeline:
    name: periodic-stable
    manager: independent
    trigger:
      timer:
        - time: '* * * * * */1'
          branch: '^stable/.*'

- job:
    name: base
    parent: null
    run: playbooks/base.yaml

- job:
    name: project-master-periodic
    run: playbooks/project-test1.yaml

- job:
    name: project-stable-periodic
    run: playbooks/project-test2.yaml

- project:
    name: org/project
    periodic:
      jobs:
        - project-master-periodic
    periodic-stable:
      jobs:
        - project-stable-periodic
