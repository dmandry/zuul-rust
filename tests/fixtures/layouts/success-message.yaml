- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success-message: Good build {pipeline.name}.
    failure-message: Bad build {pipeline.name}.
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- job:
    name: base
    parent: null
    run: playbooks/base.yaml

- job:
    name: goodjob
    success-message: YAY

- job:
    name: badjob
    failure-message: BOO

- project:
    name: org/project1
    check:
      jobs:
        - goodjob
        - badjob
