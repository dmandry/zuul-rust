[statsd]
# note, use 127.0.0.1 rather than localhost to avoid getting ipv6
# see: https://github.com/jsocol/pystatsd/issues/61
server=127.0.0.1

[scheduler]
tenant_config=config/multi-driver/main.yaml

[merger]
git_dir=/tmp/zuul-test/git
git_user_email=zuul@example.com
git_user_name=zuul

[executor]
git_dir=/tmp/zuul-test/executor-git
load_multiplier=100

[auth zuul_operator]
driver=HS256
allow_authz_override=true
realm=zuul.example.com
client_id=zuul.example.com
issuer_id=zuul_operator
secret=ThisIsABadSecretOnlyUsedForTesting

[connection gerrit]
driver=gerrit
server=review.example.com
user=jenkins
sshkey=none
password=badpassword

[connection github]
driver=github
webhook_token=00000000000000000000000000000000000000000

[connection outgoing_smtp]
driver=smtp
server=localhost
port=25
default_from=zuul@example.com
default_to=you@example.com

[database]
dburi=$MYSQL_FIXTURE_DBURI$

[connection aws]
driver=aws
access_key_id=fake
secret_access_key=fake

[connection azure]
driver=azure
client_id=1691d403-ef17-471e-a478-ea1386b9022c
client_secret=8508d112-3c33-4499-95f1-0b7d391b70e2
subscription_id=582c3efd-3e57-4073-82c5-d122636fb45c
tenant_id=b6e5bbf0-ebc0-48a7-9112-ad8829d7edc1

[connection openstack]
driver=openstack
cloud=fakecloud

[connection openstack2]
driver=openstack
cloud=fakecloud

[connection static]
driver=static
