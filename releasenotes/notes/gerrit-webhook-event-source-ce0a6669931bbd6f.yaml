---
features:
  - |
    Support for receiving trigger events from Gerrit's ``webhooks``
    plugin over HTTP has been added to the Gerrit driver. This is
    intended as a lightweight alternative to the SSH ``stream-events``
    listener for deployments that prefer not to manage an SSH key or
    open port 29418.

    Set ``stream_events=false``, ``webhook_events=true``, and
    ``webhook_token=<secret>`` on the connection, and configure the
    Gerrit ``webhooks`` plugin to POST to the new
    ``/api/connection/<connection-name>/payload`` endpoint exposed by
    zuul-web.

    ``webhook_token`` must be set on the connection to authenticate
    incoming webhook requests. The token is supplied as a ``?token=``
    query parameter on the configured webhook URL.

    See the Gerrit driver documentation for details, including the
    delivery-guarantee trade-off relative to queued event sources
    (Kafka, Kinesis, Google Cloud Pub/Sub).
