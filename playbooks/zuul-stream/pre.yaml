- hosts: controller
  roles:

    - role: ensure-pip

    - role: bindep
      bindep_profile: compile
      bindep_dir: src/opendev.org/zuul/zuul

  post_tasks:

    - name: Create build and install venvs
      shell: |+
        python3 -m venv ~/build-venv
        ~/build-venv/bin/pip install --upgrade pip 'setuptools<82' wheel
        python3 -m venv ~/zuul-venv
        ~/build-venv/bin/pip install --upgrade pip setuptools wheel

    - name: Build wheel
      shell:
        chdir: src/opendev.org/zuul/zuul
        cmd: |+
          ~/build-venv/bin/python3 setup.py bdist_wheel

    - name: Install zuul
      shell: |+
        ~/zuul-venv/bin/pip install src/opendev.org/zuul/zuul/dist/*.whl

    - name: Install managed ansible versions
      command: "{{ ansible_user_dir }}/zuul-venv/bin/zuul-manage-ansible -v"

    - name: Copy inventory
      copy:
        src: "{{ zuul.executor.log_root }}/zuul-info/inventory.yaml"
        dest: "{{ ansible_user_dir }}/inventory.yaml"

    - name: Copy ansible.cfg
      template:
        src: templates/ansible.cfg.j2
        dest: "{{ ansible_user_dir }}/ansible.cfg"

    - name: Generate logging config
      command: "{{ ansible_user_dir }}/zuul-venv/bin/python3 src/opendev.org/zuul/zuul/zuul/ansible/logconfig.py"
